<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Bottle -->
  <rect x="60" y="80" width="80" height="120" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Medicine inside -->
  <rect x="65" y="100" width="70" height="95" fill="#F59E0B" opacity="0.7"/>
  
  <!-- Cap -->
  <rect x="75" y="65" width="50" height="20" rx="3" fill="#374151" stroke="#1F2937" stroke-width="1.5"/>
  <ellipse cx="100" cy="65" rx="25" ry="8" fill="#4B5563" opacity="0.6"/>
  
  <!-- Label -->
  <rect x="65" y="110" width="70" height="35" fill="#FFFFFF" opacity="0.9" rx="3"/>
  <text x="100" y="127" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">Paracetamol</text>
  <text x="100" y="140" font-size="9" text-anchor="middle" fill="#6B7280">500mg</text>
  
  <!-- Shine effect -->
  <ellipse cx="75" cy="95" rx="6" ry="20" fill="#FFFFFF" opacity="0.4"/>
</svg>
