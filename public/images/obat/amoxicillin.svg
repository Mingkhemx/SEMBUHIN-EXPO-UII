    <rect x="105" y="135" width="15" height="30" rx="7.5" fill="#DC2626"/>
    <rect x="120" y="135" width="15" height="30" rx="7.5" fill="#FCA5A5"/>
  </g>
  
  <!-- Label -->
  <text x="100" y="195" font-size="12" font-weight="bold" text-anchor="middle" fill="#7F1D1D">Amoxicillin</text>
  <text x="100" y="210" font-size="8" text-anchor="middle" fill="#991B1B">500mg x 4</text>
